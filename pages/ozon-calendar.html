<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄罗斯电商大促日历 - OZON工具盒子</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  
  <style>
    :root {
        /* === [配色] 旗舰级流光白金 === */
        --bg-body: #F8F9FC; 
        --bg-glass: rgba(255, 255, 255, 0.65);
        --bg-glass-heavy: rgba(255, 255, 255, 0.95);
        
        /* 品牌色 */
        --primary: #2563EB; 
        --accent: #F97316;
        --gradient-text: linear-gradient(135deg, #2563EB 0%, #3B82F6 50%, #F97316 100%);
        --gradient-header: linear-gradient(135deg, #FFEF9F 0%, #FFD54F 100%); /* 月份头部专用 */
        
        /* 文本 */
        --text-main: #0F172A; 
        --text-sub: #64748B;
        
        /* 阴影与圆角 */
        --shadow-float: 0 20px 40px -10px rgba(15, 23, 42, 0.05);
        --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        
        --radius-xl: 32px;
        --radius-lg: 24px;
        --radius-md: 16px;
        
        --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        
        --container-width: 1200px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        line-height: 1.6;
        overflow-x: hidden;
        background-image: 
            radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.03) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(249, 115, 22, 0.03) 0px, transparent 50%);
        background-attachment: fixed;
        min-height: 100vh;
    }

    /* 动画定义 */
    @keyframes flowIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pendulum { 0% { transform: rotate(0deg); } 25% { transform: rotate(2deg); } 75% { transform: rotate(-2deg); } 100% { transform: rotate(0deg); } }

    /* === 1. 悬浮岛屿导航栏 === */
    .navbar {
        position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
        width: 95%; max-width: 1400px;
        height: 80px;
        background: var(--bg-glass-heavy);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        display: flex; align-items: center; justify-content: space-between;
        /* 右侧增加巨大内边距，给吊坠留出绝对安全区 */
        padding-left: 32px; padding-right: 140px; 
        z-index: 1000;
        transition: all 0.4s var(--ease-out);
    }

    .navbar.scrolled {
        top: 0; width: 100%; max-width: 100%; border-radius: 0;
        background: rgba(255,255,255,0.98);
        height: 72px;
        border-bottom: 1px solid rgba(0,0,0,0.05);
        padding-right: 140px; 
    }

    .navbar-brand {
        display: flex; align-items: center; gap: 14px;
        font-size: 1.4rem; font-weight: 800; color: var(--text-main);
        text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0;
    }
    .navbar-logo {
        width: 42px; height: 42px; border-radius: 12px;
        background: #fff; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 1.2rem; color: var(--primary);
    }

    .navbar-nav {
        display: flex; align-items: center; gap: 6px; list-style: none;
        /* 关键：右侧留白防止遮挡 */
        margin-right: 200px; 
    }

    .nav-link {
        padding: 8px 14px; border-radius: 10px;
        color: var(--text-sub); text-decoration: none; font-weight: 600;
        font-size: 0.9rem; transition: all 0.3s; white-space: nowrap;
    }
    .nav-link:hover { color: var(--text-main); background: rgba(0,0,0,0.03); }
    .nav-link.active { color: var(--primary); background: #EFF6FF; }

    /* 广告胶囊：强制不收缩 */
    .ad-pill {
        display: flex; align-items: center; gap: 8px;
        font-size: 0.8rem; color: var(--text-sub);
        border: 1px solid rgba(0,0,0,0.08);
        padding: 8px 16px; border-radius: 100px;
        background: rgba(255,255,255,0.5);
        transition: 0.3s;
        /* 关键属性：防止文字被压缩 */
        white-space: nowrap; 
        flex-shrink: 0; 
        max-width: 500px; 
        overflow: visible;
    }
    .ad-pill:hover { background: #fff; border-color: var(--accent); color: var(--text-main); }
    
    .qr-wrapper { position: relative; cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--text-main); margin-left: 8px; padding-left: 8px; border-left: 1px solid #ddd; }
    .qr-popup {
        position: absolute; top: 160%; left: 50%; transform: translateX(-50%) scale(0.9);
        width: 140px; background: #fff; padding: 10px; border-radius: 16px;
        box-shadow: var(--shadow-float); opacity: 0; visibility: hidden;
        transition: 0.3s var(--ease-elastic); z-index: 1100;
    }
    .qr-wrapper:hover .qr-popup { opacity: 1; visibility: visible; transform: translateX(-50%) scale(1); top: 140%; }
    .qr-popup img { width: 100%; border-radius: 8px; display: block; }

    /* 移动端菜单按钮 */
    .menu-toggle { display: none; background: none; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer; }

    /* === ★★★ 旗舰吊坠 (全息铭牌) ★★★ === */
    .pendant-container {
        position: fixed; 
        top: 24px; 
        right: 40px; /* 固定在视窗最右侧 */
        z-index: 1002;
        display: flex; flex-direction: column; align-items: center;
        transform-origin: top center;
        animation: pendulum 6s ease-in-out infinite;
        transition: top 0.4s;
    }
    
    .pendant-rope {
        width: 2px; height: 35px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4));
        margin-top: -10px;
    }
    
    .pendant-badge {
        width: 150px; 
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,1);
        border-radius: 20px;
        padding: 16px;
        text-decoration: none;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        box-shadow: 
            0 15px 35px -5px rgba(0, 0, 0, 0.1),
            inset 0 0 0 1px rgba(255,255,255,0.5);
        transition: transform 0.3s var(--ease-out);
        position: relative;
        overflow: hidden;
    }

    .pendant-badge::before {
        content:''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
        background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .badge-icon {
        width: 48px; height: 48px;
        background: linear-gradient(135deg, #EFF6FF 0%, #FFF7ED 100%);
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.5rem; color: var(--primary);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    }

    .badge-text { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .badge-sub { font-size: 10px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

    .pendant-container:hover { animation-play-state: paused; }
    .pendant-container:hover .pendant-badge { transform: translateY(5px) scale(1.03); background: #fff; }
    body.is-scrolled .pendant-container { top: 0; }

    /* === 页面内容 === */
    .main-content {
        padding-top: 220px; 
        padding-bottom: 80px;
        min-height: 100vh;
    }
    
    .container {
        max-width: var(--container-width);
        margin: 0 auto;
        padding: 0 24px;
    }

    /* 返回按钮 */
    .back-nav {
        position: absolute; top: 140px; left: 0; right: 0;
        max-width: var(--container-width); margin: 0 auto; padding: 0 24px;
        z-index: 10;
    }
    .back-btn {
        display: inline-flex; align-items: center; gap: 8px;
        color: var(--text-sub); text-decoration: none; font-size: 0.95rem; font-weight: 600;
        padding: 10px 20px; background: #fff; border-radius: 100px;
        box-shadow: var(--shadow-card); transition: all 0.3s var(--ease-out);
    }
    .back-btn:hover {
        transform: translateX(-5px); color: var(--primary);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    }

    /* 月份切换器 */
    .month-picker {
        background: #fff; border-radius: var(--radius-xl); padding: 16px;
        box-shadow: var(--shadow-card); margin-bottom: 32px;
        display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
        animation: flowIn 0.8s var(--ease-out);
    }
    
    .btn {
        display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px;
        border-radius: 100px; text-decoration: none; font-weight: 600; font-size: 0.95rem;
        background: #F8FAFC; color: var(--text-sub); border: 1px solid transparent;
        transition: all 0.3s;
    }
    .btn:hover {
        background: #fff; border-color: var(--primary); color: var(--primary);
        transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    }
    .btn.primary {
        background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .btn.primary:hover { background: #1D4ED8; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4); }

    /* 月份头部 */
    .month-header {
        background: var(--gradient-header);
        border-radius: var(--radius-xl); padding: 40px; text-align: center;
        margin-bottom: 40px; box-shadow: var(--shadow-float);
        position: relative; overflow: hidden; animation: flowIn 1s var(--ease-out);
    }
    .month-title {
        font-size: 4rem; font-weight: 800; color: #78350F; margin: 0 0 16px;
        letter-spacing: -2px; line-height: 1;
    }
    .month-weather { font-size: 1.2rem; font-weight: 600; color: #92400E; margin-bottom: 24px; }
    .month-summary {
        background: rgba(255,255,255,0.6); backdrop-filter: blur(10px);
        padding: 24px; border-radius: 20px; color: #451A03; font-size: 1.1rem;
        max-width: 800px; margin: 0 auto; line-height: 1.6;
    }

    /* 内容区块 */
    .section-title {
        font-size: 1.8rem; font-weight: 800; color: var(--text-main);
        margin: 60px 0 32px; display: flex; align-items: center; gap: 12px;
    }
    .section-title::before {
        content: ''; width: 6px; height: 32px; background: var(--accent); border-radius: 4px;
    }

    /* 节日列表 */
    .festival-list { display: grid; gap: 20px; }
    .festival-item {
        background: #fff; border-radius: var(--radius-lg); padding: 24px;
        display: flex; gap: 24px; align-items: flex-start;
        box-shadow: var(--shadow-card); transition: 0.3s; border: 1px solid rgba(0,0,0,0.03);
    }
    .festival-item:hover { transform: translateY(-4px); box-shadow: var(--shadow-float); }
    
    .festival-date {
        background: #0F172A; color: #fff; padding: 12px 20px; border-radius: 12px;
        font-weight: 700; font-size: 1.1rem; min-width: 100px; text-align: center;
    }
    .festival-content h3 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 700; color: var(--text-main); }
    .festival-content p { margin: 0; color: var(--text-sub); line-height: 1.6; }
    .festival-tag {
        margin-left: auto; background: #FEF3C7; color: #D97706; padding: 6px 12px;
        border-radius: 8px; font-weight: 700; font-size: 0.9rem; white-space: nowrap;
    }

    /* 品类卡片 */
    .category-card {
        background: #fff; border-radius: var(--radius-xl); overflow: hidden;
        box-shadow: var(--shadow-card); margin-bottom: 32px; border: 1px solid rgba(0,0,0,0.03);
    }
    .category-header {
        background: #F8FAFC; padding: 24px 32px; border-bottom: 1px solid #E2E8F0;
        display: flex; align-items: center; gap: 20px;
    }
    .cat-icon {
        width: 56px; height: 56px; background: var(--primary); color: #fff;
        border-radius: 16px; display: grid; place-items: center; font-size: 1.8rem;
    }
    .cat-title { margin: 0; font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
    .cat-growth { color: #DC2626; font-weight: 700; font-size: 1.1rem; background: #FEF2F2; padding: 4px 12px; border-radius: 100px; }

    .category-body { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px; }
    
    .analysis-box {
        background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 20px; padding: 24px;
    }
    .analysis-title { color: #1E40AF; font-weight: 700; margin-bottom: 12px; font-size: 1.1rem; }
    .analysis-text { color: #1E3A8A; line-height: 1.7; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; }
    .product-item {
        background: #fff; border: 1px solid #E2E8F0; border-radius: 12px;
        padding: 16px; text-align: center; position: relative; font-weight: 600; color: var(--text-main);
        transition: 0.3s;
    }
    .product-item:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); }
    .product-item.hot::after {
        content: '🔥'; position: absolute; top: -8px; right: -8px;
        background: #fff; border-radius: 50%; padding: 2px; font-size: 1.2rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* 策略卡片 */
    .strategy-card {
        background: #fff; border-radius: var(--radius-xl); padding: 40px;
        box-shadow: var(--shadow-card); margin-bottom: 32px; border: 1px solid rgba(0,0,0,0.03);
    }
    .strategy-head { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
    .strategy-head i { color: var(--accent); }
    .strategy-content {
        background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 16px;
        padding: 24px; color: #9A3412; line-height: 1.7; font-size: 1.05rem;
    }

    .ops-grid { display: grid; gap: 16px; }
    .ops-item {
        background: #F0F9FF; border-left: 4px solid #0EA5E9; border-radius: 12px;
        padding: 20px; color: #0C4A6E; line-height: 1.6;
    }
    .ops-item b { color: #0284C7; margin-right: 8px; }

    @media (max-width: 1300px) {
        .navbar-nav { display: none; }
        .menu-toggle { display: block; }
        .pendant-container { display: none; }
        .navbar { padding-right: 24px; }
        .category-body { grid-template-columns: 1fr; }
        .festival-item { flex-direction: column; gap: 16px; }
        .festival-date { align-self: flex-start; }
        .festival-tag { margin-left: 0; align-self: flex-start; }
    }
  </style>
</head>

  <script>
    const DATA_URL = './data/ozon-calendar-data.json';

    function getMonthFromQuery() {
      const p = new URLSearchParams(location.search);
      const m = (p.get('month') || '').toLowerCase();
      const months = ['january','february','march','april','may','june','july','august','september','october','november','december'];
      const shortMonths = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
      
      if (months.includes(m)) return m;
      const idx = shortMonths.indexOf(m);
      return idx > -1 ? months[idx] : 'january';
    }

    function renderMonth(monthData) {
      const container = document.getElementById('calendar-content');
      
      const html = `
        <div class="month-header">
          <h1 class="month-title">${monthData.month}</h1>
          <div class="month-weather"><i class="fas fa-cloud-sun"></i> ${monthData.weather.condition} ${monthData.weather.temp}</div>
          <div class="month-summary">${monthData.summary}</div>
        </div>

        <div>
          <h2 class="section-title">重要节日与消费特点</h2>
          <div class="festival-list">
            ${monthData.festivals.map(f => `
              <div class="festival-item">
                <div class="festival-date">${f.date}</div>
                <div class="festival-content">
                  <h3>${f.name}</h3>
                  <p>${f.description}</p>
                </div>
                ${f.tag ? `<div class="festival-tag">${f.tag}</div>` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        <div>
          <h2 class="section-title">重点推广品类及理由</h2>
          ${monthData.recommended_categories.map(cat => `
            <div class="category-card">
              <div class="category-header">
                <span class="cat-icon"><i class="fas ${cat.icon}"></i></span>
                <h3 class="cat-title">${cat.name}</h3>
                <span class="cat-growth">${cat.sales_growth}</span>
              </div>
              <div class="category-body">
                <div class="analysis-box">
                  <div class="analysis-title"><i class="fas fa-lightbulb"></i> 推广理由分析</div>
                  <div class="analysis-text">${cat.analysis}</div>
                </div>
                <div class="product-grid">
                  ${cat.products.map(p => `<div class="product-item ${p.hot ? 'hot' : ''}">${p.name}</div>`).join('')}
                </div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="strategy-card">
          <div class="strategy-head"><i class="fas ${monthData.marketing_strategy.icon}"></i> ${monthData.marketing_strategy.title}</div>
          <div class="strategy-content">${monthData.marketing_strategy.suggestion}</div>
        </div>

        <div class="strategy-card">
          <div class="strategy-head"><i class="fas ${monthData.platform_operations.icon}"></i> ${monthData.platform_operations.title}</div>
          <div class="ops-grid">
            ${monthData.platform_operations.points.map(p => `<div class="ops-item"><b>${p.platform}:</b> ${p.action}</div>`).join('')}
          </div>
        </div>
      `;
      container.innerHTML = html;
    }

    // 导航栏滚动逻辑
    window.addEventListener('scroll', () => {
        const nav = document.getElementById('navbar');
        const body = document.body;
        if (window.scrollY > 50) {
            nav.classList.add('scrolled');
            body.classList.add('is-scrolled');
        } else {
            nav.classList.remove('scrolled');
            body.classList.remove('is-scrolled');
        }
    });

    fetch(DATA_URL)
      .then(r => r.json())
      .then(data => {
        const m = getMonthFromQuery();
        renderMonth(data[m] || data.january);
        
        // 激活按钮样式
        const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
        const fullMonths = ['january','february','march','april','may','june','july','august','september','october','november','december'];
        
        months.forEach((short, idx) => {
            const btn = document.getElementById(`btn-${short}`);
            if(btn) {
                btn.className = fullMonths[idx] === m ? 'btn primary' : 'btn';
            }
        });
      })
      .catch(err => {
        const root = document.getElementById('calendar-content');
        root.innerHTML = '<div style="background:#FEF2F2; color:#DC2626; padding:20px; border-radius:12px; text-align:center;">加载日历数据失败，请检查数据文件或网络连接。</div>';
        console.error(err);
      });
  </script>
</body>
</html>
