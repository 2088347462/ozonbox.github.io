<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>秋冬用品选品手册 - OZON工具盒子</title>
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="icon" type="image/svg+xml" href="../images/favicon.svg">
  
  <style>
    :root {
        /* === [配色] 旗舰级流光白金 === */
        --bg-body: #F8F9FC; 
        --bg-glass: rgba(255, 255, 255, 0.65);
        --bg-glass-heavy: rgba(255, 255, 255, 0.95);
        
        /* 品牌色 */
        --primary: #2563EB; 
        --accent: #F97316;
        --gradient-text: linear-gradient(135deg, #2563EB 0%, #3B82F6 50%, #F97316 100%);
        --gradient-card: linear-gradient(135deg, #EFF6FF 0%, #F0F9FF 100%);
        
        /* 文本 */
        --text-main: #0F172A; 
        --text-sub: #64748B;
        
        /* 阴影与圆角 */
        --shadow-float: 0 20px 40px -10px rgba(15, 23, 42, 0.05);
        --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 10px 15px -3px rgba(0, 0, 0, 0.04);
        
        --radius-xl: 32px;
        --radius-lg: 24px;
        --radius-md: 16px;
        
        --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1);
        
        --container-width: 1200px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        line-height: 1.6;
        overflow-x: hidden;
        background-image: 
            radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.03) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(249, 115, 22, 0.03) 0px, transparent 50%);
        background-attachment: fixed;
        min-height: 100vh;
    }

    /* 动画定义 */
    @keyframes flowIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pendulum { 0% { transform: rotate(0deg); } 25% { transform: rotate(2deg); } 75% { transform: rotate(-2deg); } 100% { transform: rotate(0deg); } }

    /* === 1. 悬浮岛屿导航栏 === */
    .navbar {
        position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
        width: 95%; max-width: 1400px;
        height: 80px;
        background: var(--bg-glass-heavy);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.6);
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        display: flex; align-items: center; justify-content: space-between;
        /* 右侧增加巨大内边距，给吊坠留出绝对安全区 */
        padding-left: 32px; padding-right: 140px; 
        z-index: 1000;
        transition: all 0.4s var(--ease-out);
    }

    .navbar.scrolled {
        top: 0; width: 100%; max-width: 100%; border-radius: 0;
        background: rgba(255,255,255,0.98);
        height: 72px;
        border-bottom: 1px solid rgba(0,0,0,0.05);
        padding-right: 140px; 
    }

    .navbar-brand {
        display: flex; align-items: center; gap: 14px;
        font-size: 1.4rem; font-weight: 800; color: var(--text-main);
        text-decoration: none; letter-spacing: -0.5px; flex-shrink: 0;
    }
    .navbar-logo {
        width: 42px; height: 42px; border-radius: 12px;
        background: #fff; display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 1.2rem; color: var(--primary);
    }

    .navbar-nav {
        display: flex; align-items: center; gap: 6px; list-style: none;
        /* 关键：右侧留白防止遮挡 */
        margin-right: 200px; 
    }

    .nav-link {
        padding: 8px 14px; border-radius: 10px;
        color: var(--text-sub); text-decoration: none; font-weight: 600;
        font-size: 0.9rem; transition: all 0.3s; white-space: nowrap;
    }
    .nav-link:hover { color: var(--text-main); background: rgba(0,0,0,0.03); }
    .nav-link.active { color: var(--primary); background: #EFF6FF; }

    /* 广告胶囊：强制不收缩 */
    .ad-pill {
        display: flex; align-items: center; gap: 8px;
        font-size: 0.8rem; color: var(--text-sub);
        border: 1px solid rgba(0,0,0,0.08);
        padding: 8px 16px; border-radius: 100px;
        background: rgba(255,255,255,0.5);
        transition: 0.3s;
        /* 关键属性：防止文字被压缩 */
        white-space: nowrap; 
        flex-shrink: 0; 
        max-width: 500px; 
        overflow: visible;
    }
    .ad-pill:hover { background: #fff; border-color: var(--accent); color: var(--text-main); }
    
    .qr-wrapper { position: relative; cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 600; color: var(--text-main); margin-left: 8px; padding-left: 8px; border-left: 1px solid #ddd; }
    .qr-popup {
        position: absolute; top: 160%; left: 50%; transform: translateX(-50%) scale(0.9);
        width: 140px; background: #fff; padding: 10px; border-radius: 16px;
        box-shadow: var(--shadow-float); opacity: 0; visibility: hidden;
        transition: 0.3s var(--ease-elastic); z-index: 1100;
    }
    .qr-wrapper:hover .qr-popup { opacity: 1; visibility: visible; transform: translateX(-50%) scale(1); top: 140%; }
    .qr-popup img { width: 100%; border-radius: 8px; display: block; }

    /* 移动端菜单按钮 */
    .menu-toggle { display: none; background: none; border: none; font-size: 1.5rem; color: var(--text-main); cursor: pointer; }

    /* === ★★★ 旗舰吊坠 (全息铭牌) ★★★ === */
    .pendant-container {
        position: fixed; 
        top: 24px; 
        right: 40px; /* 固定在视窗最右侧 */
        z-index: 1002;
        display: flex; flex-direction: column; align-items: center;
        transform-origin: top center;
        animation: pendulum 6s ease-in-out infinite;
        transition: top 0.4s;
    }
    
    .pendant-rope {
        width: 2px; height: 35px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.4));
        margin-top: -10px;
    }
    
    .pendant-badge {
        width: 150px; 
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,1);
        border-radius: 20px;
        padding: 16px;
        text-decoration: none;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        box-shadow: 
            0 15px 35px -5px rgba(0, 0, 0, 0.1),
            inset 0 0 0 1px rgba(255,255,255,0.5);
        transition: transform 0.3s var(--ease-out);
        position: relative;
        overflow: hidden;
    }

    .pendant-badge::before {
        content:''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
        background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .badge-icon {
        width: 48px; height: 48px;
        background: linear-gradient(135deg, #EFF6FF 0%, #FFF7ED 100%);
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.5rem; color: var(--primary);
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.03);
    }

    .badge-text { font-size: 14px; font-weight: 700; color: var(--text-main); }
    .badge-sub { font-size: 10px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

    .pendant-container:hover { animation-play-state: paused; }
    .pendant-container:hover .pendant-badge { transform: translateY(5px) scale(1.03); background: #fff; }
    body.is-scrolled .pendant-container { top: 0; }

    /* === 页面内容 === */
    .main-content {
        padding-top: 220px; 
        padding-bottom: 80px;
        min-height: 100vh;
    }
    
    .container {
        max-width: var(--container-width);
        margin: 0 auto;
        padding: 0 24px;
    }

    /* 返回按钮 */
    .back-nav {
        position: absolute; top: 140px; left: 0; right: 0;
        max-width: var(--container-width); margin: 0 auto; padding: 0 24px;
        z-index: 10;
    }
    .back-btn {
        display: inline-flex; align-items: center; gap: 8px;
        color: var(--text-sub); text-decoration: none; font-size: 0.95rem; font-weight: 600;
        padding: 10px 20px; background: #fff; border-radius: 100px;
        box-shadow: var(--shadow-card); transition: all 0.3s var(--ease-out);
    }
    .back-btn:hover {
        transform: translateX(-5px); color: var(--primary);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    }

    /* 标题区 */
    .header { text-align: center; margin-bottom: 60px; animation: flowIn 0.8s var(--ease-out); }
    .title {
        font-size: 3rem; font-weight: 800; color: var(--text-main);
        margin-bottom: 16px; letter-spacing: -1px;
    }
    .subtitle { font-size: 1.2rem; color: var(--text-sub); max-width: 600px; margin: 0 auto; }

    /* 分类卡片 */
    .panel {
        background: #fff; border-radius: var(--radius-xl); box-shadow: var(--shadow-card);
        margin-bottom: 32px; border: 1px solid rgba(0,0,0,0.03);
        animation: flowIn 1s var(--ease-out);
    }
    .panel-header {
        background: var(--gradient-card); padding: 24px 32px;
        display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #F1F5F9;
    }
    .panel-icon {
        width: 48px; height: 48px; background: #fff; color: var(--primary);
        border-radius: 14px; display: grid; place-items: center; font-size: 1.4rem;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    }
    .panel-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin: 0; }
    .panel-desc { margin: 0; color: var(--text-sub); font-size: 0.95rem; }

    .item {
        padding: 24px 32px; border-bottom: 1px solid #F1F5F9; transition: 0.3s;
    }
    .item:last-child { border-bottom: none; }
    .item:hover { background: #F8FAFC; }

    .item-head {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .item-name { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
    
    .btn-copy {
        background: var(--text-main); color: #fff; padding: 8px 16px;
        border-radius: 100px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none;
        transition: 0.2s;
    }
    .btn-copy:hover { background: var(--primary); transform: translateY(-1px); }

    .tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .tag {
        background: #fff; border: 1px solid #E2E8F0; color: var(--text-sub);
        padding: 6px 14px; border-radius: 100px; font-size: 0.9rem; cursor: pointer;
        transition: 0.2s;
    }
    .tag:hover {
        border-color: var(--primary); color: var(--primary); background: #EFF6FF;
        transform: translateY(-1px);
    }

    @media (max-width: 1300px) {
        .navbar-nav { display: none; }
        .menu-toggle { display: block; }
        .pendant-container { display: none; }
        .navbar { padding-right: 24px; }
    }
    @media (max-width: 768px) {
        .title { font-size: 2rem; }
        .item-head { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>

  <nav class="navbar" id="navbar">
    <a href="../index.html" class="navbar-brand">
        <div class="navbar-logo">
            <i class="fas fa-cube"></i>
        </div>
        OZON工具盒子
    </a>
    
    <div class="ad-pill">
        <i class="fas fa-shipping-fast" style="color:var(--accent)"></i>
        <span>OZON专业货代 | UNI、GUOO物流 | 当天核验，24h内上网 | 价格实惠</span>
        <div class="qr-wrapper">
            <i class="fas fa-qrcode"></i>
            <div class="qr-popup">
                <img src="../images/wang.png" alt="QR">
            </div>
        </div>
    </div>

    <ul class="navbar-nav">
        <li><a href="../index.html" class="nav-link">首页</a></li>
        <li><a href="ai-tools.html" class="nav-link">AI工具</a></li>
        <li><a href="tools.html" class="nav-link active">实用工具</a></li>
        <li><a href="auxiliary-tools.html" class="nav-link">辅助工具</a></li>
        <li><a href="ozon-plugin.html" class="nav-link">数据插件</a></li>
        <li><a href="volumetric-check.html" class="nav-link">计抛检查</a></li>
    </ul>
    
    <button class="menu-toggle" onclick="alert('移动端菜单开发中...')">
        <i class="fas fa-bars"></i>
    </button>
  </nav>
  
  <div class="pendant-container">
    <div class="pendant-rope"></div>
    <a href="https://ozonbox.top/pages/ozon_editor.html" target="_blank" class="pendant-badge">
        <div class="badge-icon">
            <i class="fas fa-layer-group"></i>
        </div>
        <div style="text-align:center;">
            <div class="badge-text">图形编辑器</div>
            <div class="badge-sub">Pro Tools</div>
        </div>
    </a>
  </div>

  <main class="main-content">
    <div class="container">
      <div class="back-nav">
        <a href="selection-manual.html" class="back-btn">
            <i class="fas fa-arrow-left"></i> 返回选品手册
        </a>
      </div>

      <div class="header">
        <h1 class="title">秋冬用品选品手册</h1>
        <p class="subtitle">中俄文对照表｜点击俄文标签在 Ozon 搜索，或一键复制全部标签词</p>
      </div>

      <div id="content"></div>
    </div>
  </main>

  <script>
    const DATA_URL = './data/selection-winter.json';
    
    function openOzonSearch(q) { 
        window.open('https://www.ozon.ru/search/?text=' + encodeURIComponent(q), '_blank', 'noopener'); 
    }
    
    function copyText(text) { 
      navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板')); 
    }
    
    function showToast(message) {
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 24px;border-radius:100px;box-shadow:0 10px 30px rgba(0,0,0,0.2);z-index:9999;font-size:0.95rem;opacity:0;transition:0.3s;';
      toast.textContent = message;
      document.body.appendChild(toast);
      
      // 显示动画
      requestAnimationFrame(() => {
          toast.style.opacity = '1';
          toast.style.transform = 'translateX(-50%) translateY(-10px)';
      });
      
      setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(-50%) translateY(0)';
          setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    function renderCategory(category) {
      const panel = document.createElement('div');
      panel.className = 'panel';
      
      // 构建头部
      const headerHtml = `
        <div class="panel-header">
          <div class="panel-icon"><i class="${category.icon || 'fas fa-list'}"></i></div>
          <div>
            <h3 class="panel-title">${category.name}</h3>
            <p class="panel-desc">${category.desc || ''}</p>
          </div>
        </div>
      `;
      
      const itemsContainer = document.createElement('div');
      
      (category.items || []).forEach(item => {
        const wrap = document.createElement('div');
        wrap.className = 'item';
        wrap.innerHTML = `
          <div class="item-head">
            <div class="item-name">${item.cn}</div>
            <button class="btn-copy"><i class="far fa-copy"></i> 复制所有标签</button>
          </div>
          <div class="tags"></div>
        `;
        
        const tagsDiv = wrap.querySelector('.tags');
        const allTags = (item.ru || []);
        
        allTags.forEach(t => {
          const b = document.createElement('button');
          b.className = 'tag';
          b.textContent = t;
          b.title = '点击在OZON搜索';
          b.addEventListener('click', () => openOzonSearch(t));
          tagsDiv.appendChild(b);
        });
        
        wrap.querySelector('.btn-copy').addEventListener('click', () => {
          const formatted = allTags.map(t => `#${t}`).join('\n');
          copyText(formatted);
        });
        
        itemsContainer.appendChild(wrap);
      });
      
      panel.innerHTML = headerHtml;
      panel.appendChild(itemsContainer);
      return panel;
    }

    // 导航栏滚动逻辑
    window.addEventListener('scroll', () => {
        const nav = document.getElementById('navbar');
        const body = document.body;
        if (window.scrollY > 50) {
            nav.classList.add('scrolled');
            body.classList.add('is-scrolled');
        } else {
            nav.classList.remove('scrolled');
            body.classList.remove('is-scrolled');
        }
    });

    fetch(DATA_URL).then(r => r.json()).then(data => {
      const root = document.getElementById('content');
      data.categories.forEach(cat => root.appendChild(renderCategory(cat)));
    }).catch(err => {
      const root = document.getElementById('content');
      root.innerHTML = '<div class="panel" style="padding:40px; text-align:center; color:#DC2626; background:#FEF2F2;"><i class="fas fa-exclamation-triangle" style="font-size:2rem; margin-bottom:10px;"></i><br>无法加载数据文件，请检查网络连接。</div>';
      console.error(err);
    });
  </script>
</body>
</html>
